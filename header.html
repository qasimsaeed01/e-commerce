<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
  </style>
</head>

<body>
  <header>
    <div class="nav-sec">
      <div class="logo-sec">
        <div><img class="logo" src="images/logo.png" alt="WEB WEAVERS"></div>
        <div class="menu">
          <span class="shops">Shops <i class="fa-solid fa-caret-down"></i></span>
          <div class="mega-menu-container">
            <div class="mega-menu">
              <h3>Catalogue</h3>
              <ul>
                <li><a href="#">All Products</a></li>
                <li><a href="#">Search</a></li>
                <li><a href="#">Backpack</a></li>
                <li><a href="#">Car Coat</a></li>
              </ul>
            </div>
            <div class="mega-menu">
              <h3>News</h3>
              <ul>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Updates</a></li>
                <li><a href="#">Sales</a></li>
              </ul>
            </div>
            <div class="mega-menu">
              <h3>Collection</h3>
              <ul>
                <li><a href="#">Men's Collection</a></li>
                <li><a href="#">Kid's Accessories</a></li>
                <li><a href="#">Women's New Arrivals</a></li>
                <li><a href="#">Clearance Sale</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
      <div class="misc-sec">
        <div class="lang-element">
          <i class="fa-solid fa-globe"></i> <span>Languages <i class="fa-solid fa-caret-down"></i></span>
        </div>
        <div class="misc-element">
          <i class="fa-solid fa-magnifying-glass"></i>
          <i class="fa-regular fa-user"></i>
          <i class="fa-solid fa-cart-shopping"></i>
        </div>
      </div>
    </div>
  </header>
</body>

</html>
